<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dream Japan — Start Exam</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import {
  requireAuth, renderLayout, loadQuestions, buildSets, totalsFor, daysLeft,
  requestAccess, qs, toast
} from "./js/core.js";
import { MAX_PLAYS } from "./js/firebase.js";

const ctx = await requireAuth();
if (ctx) {
  const { profile, isAdmin } = ctx;
  renderLayout(profile, "sets", isAdmin);
  const setIdx = +qs("set");
  try {
    const { rows } = await loadQuestions();
    const sets = buildSets(rows);
    const totals = totalsFor(sets);
    renderStart(sets[setIdx], setIdx, totals, profile, isAdmin);
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="wrap" style="padding:24px">
      <div class="card"><p style="color:var(--red)">${e.message}</p></div></div>`;
  }
}

function renderStart(set, setIdx, totals, p, isAdmin) {
  if (!set) {
    document.getElementById("app").innerHTML = `<div class="wrap" style="padding:24px">
      <div class="card center"><h2>Set not found</h2>
      <button class="btn btn-primary mt-2" onclick="location.href='./sets.html'">Back</button></div></div>`;
    return;
  }
  const premiumActive = p.premium && daysLeft(p.premium.expiry) > 0;
  const hasAccess = premiumActive || p.practiceAccess || isAdmin;
  if (!hasAccess) {
    document.getElementById("app").innerHTML = `
      <div class="wrap" style="padding-top:16px">
        <button class="btn btn-ghost btn-sm mb-2" onclick="location.href='./sets.html'">← Back</button>
        <div class="card center">
          <div style="font-size:48px;margin-bottom:12px">🔒</div>
          <h2>Access Required</h2>
          <p class="muted mt-1 mb-3">Practice access or premium is needed to start exams.</p>
          <button class="btn btn-primary btn-block mb-1" onclick="location.href='./premium.html'">View Plans</button>
          <button class="btn btn-ghost btn-block" id="reqAcc">Request Access</button>
        </div>
      </div>`;
    document.getElementById("reqAcc").onclick = () => requestAccess(p);
    return;
  }
  document.getElementById("app").innerHTML = `
    <div class="wrap" style="padding-top:16px;padding-bottom:40px">
      <button class="btn btn-ghost btn-sm mb-2" onclick="location.href='./sets.html'">← Back</button>
      <div class="card card-lg">
        <div style="width:70px;height:70px;border-radius:50%;background:var(--grad);color:#fff;
          display:grid;place-items:center;font-size:32px;font-weight:800;margin:0 auto 16px">${set.kana}</div>
        <h2 class="center">${set.name}</h2>
        <p class="center muted mt-1" style="font-size:11px;letter-spacing:1.2px;font-weight:800;color:var(--purple)">
          JFT-BASIC PRACTICE MOCK TEST</p>
        <div class="grid-2 mt-3 mb-3">
          <div class="center" style="background:var(--bg);border-radius:12px;padding:14px">
            <div style="font-size:22px;font-weight:900">${totals.totalQ}</div><div class="muted small">Questions</div></div>
          <div class="center" style="background:var(--bg);border-radius:12px;padding:14px">
            <div style="font-size:22px;font-weight:900">${totals.fullMarks}</div><div class="muted small">Total Marks</div></div>
          <div class="center" style="background:var(--bg);border-radius:12px;padding:14px">
            <div style="font-size:22px;font-weight:900">60</div><div class="muted small">Minutes</div></div>
          <div class="center" style="background:var(--bg);border-radius:12px;padding:14px">
            <div style="font-size:22px;font-weight:900">${totals.passMarks}</div><div class="muted small">Pass Mark</div></div>
        </div>
        <h3 class="mb-1">Exam Rules</h3>
        <ol class="muted mb-3" style="padding-left:18px;font-size:12.5px;line-height:1.7">
          <li>Once you finish a section you cannot return to it</li>
          <li>Timer auto-submits the exam at 00:00</li>
          <li>Answer each question before moving forward</li>
          <li>Audio can be replayed ${MAX_PLAYS} times per question</li>
          <li>Pass mark: ${totals.passMarks} / ${totals.fullMarks} (80%)</li>
          <li>Your progress is saved if you refresh the page</li>
        </ol>
        <label class="flex" style="background:var(--bg);padding:12px;border-radius:10px;cursor:pointer">
          <input type="checkbox" id="agree" style="width:18px;height:18px;accent-color:var(--purple)">
          <span style="font-size:12.5px;font-weight:600">I understand the rules and am ready</span>
        </label>
        <button class="btn btn-primary btn-block mt-2" id="startBtn" disabled>START EXAM</button>
      </div>
    </div>`;
  const agree = document.getElementById("agree");
  const startBtn = document.getElementById("startBtn");
  agree.onchange = () => { startBtn.disabled = !agree.checked; };
  startBtn.onclick = () => {
    if (!agree.checked) return toast("Please agree to the rules", "err");
    location.href = `./exam.html?set=${setIdx}`;
  };
}
</script>
</body>
</html>
