<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dream Japan — Sign In</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { auth } from "./js/firebase.js";
import {
  toast, signInGoogle, signInEmail, signUpEmail, resetPassword, LOGO_SVG
} from "./js/core.js";

const qsNext = new URLSearchParams(location.search).get("next");

onAuthStateChanged(auth, (user) => {
  if (user) {
    location.replace(qsNext || "./home.html");
    return;
  }
  renderLogin();
});

function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">${LOGO_SVG}</div>
        <h2>Dream Japan</h2>
        <p class="sub">Sign in to access JFT-BASIC mock tests</p>
        <button class="gbtn" id="gLogin">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        <div class="divider">or</div>
        <div class="field"><label>Email</label>
          <input type="email" id="loginEmail" class="input" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label>
          <input type="password" id="loginPass" class="input" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-block mt-2" id="emailLogin">Sign In</button>
        <div class="login-link">
          <a id="forgotLink">Forgot password?</a> · <a id="signupLink">Create account</a>
        </div>
      </div>
    </div>`;

  document.getElementById("gLogin").onclick = signInGoogle;
  document.getElementById("emailLogin").onclick = async () => {
    const e = document.getElementById("loginEmail").value.trim();
    const p = document.getElementById("loginPass").value;
    if (!e || !p) return toast("Email and password required", "err");
    const ok = await signInEmail(e, p);
    if (ok) {
      // onAuthStateChanged handles redirect
    }
  };
  document.getElementById("signupLink").onclick = renderSignup;
  document.getElementById("forgotLink").onclick = () => {
    const email = document.getElementById("loginEmail").value.trim();
    if (!email) return toast("Enter your email first", "err");
    resetPassword(email);
  };
}

function renderSignup() {
  document.getElementById("app").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">${LOGO_SVG}</div>
        <h2>Create Account</h2>
        <p class="sub">Join Dream Japan and start practising</p>
        <div class="field"><label>Name</label>
          <input type="text" id="signName" class="input" placeholder="Your name"></div>
        <div class="field"><label>Email</label>
          <input type="email" id="signEmail" class="input" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label>
          <input type="password" id="signPass" class="input" placeholder="6+ characters"></div>
        <div class="field"><label>Confirm Password</label>
          <input type="password" id="signPass2" class="input" placeholder="Re-enter password"></div>
        <button class="btn btn-primary btn-block mt-2" id="emailSignup">Create Account</button>
        <div class="login-link">Already have an account? <a id="backLogin">Sign in</a></div>
      </div>
    </div>`;
  document.getElementById("backLogin").onclick = renderLogin;
  document.getElementById("emailSignup").onclick = async () => {
    const name = document.getElementById("signName").value.trim();
    const email = document.getElementById("signEmail").value.trim();
    const p1 = document.getElementById("signPass").value;
    const p2 = document.getElementById("signPass2").value;
    if (!email || !p1) return toast("All fields required", "err");
    if (p1 !== p2) return toast("Passwords don't match", "err");
    if (p1.length < 6) return toast("Password must be 6+ characters", "err");
    await signUpEmail(email, p1, name);
  };
}
</script>
</body>
</html>
