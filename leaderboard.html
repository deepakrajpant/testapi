<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dream Japan — Leaderboard</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { requireAuth, renderLayout, loadLeaderboard, esc } from "./js/core.js";

const ctx = await requireAuth();
if (ctx) {
  const { profile, isAdmin } = ctx;
  renderLayout(profile, "home", isAdmin);
  const lb = await loadLeaderboard();
  document.getElementById("app").innerHTML = `
    <div class="wrap" style="padding:16px 0 40px">
      <button class="btn btn-ghost btn-sm mb-2" onclick="location.href='./home.html'">← Back</button>
      <h2 class="mb-1">🏆 Leaderboard</h2>
      <p class="muted mb-3">Top 20 students by best score</p>
      <div class="card">
        ${lb.length ? lb.map((u, i) => {
          const rankClass = i === 0 ? "gold" : i === 1 ? "silver" : i === 2 ? "bronze" : "";
          return `<div class="lb-row">
            <div class="lb-rank ${rankClass}">${i + 1}</div>
            <div class="lb-info">
              <b>${esc(u.name)}</b>
              <span>🔥 ${u.streak}-day streak</span>
            </div>
            <div class="lb-score">${u.bestScore}%</div>
          </div>`;
        }).join("") : `<div class="empty">No scores yet.</div>`}
      </div>
    </div>`;
}
</script>
</body>
</html>
