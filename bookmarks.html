<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dream Japan — Bookmarks</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import {
  requireAuth, renderLayout, loadQuestions, buildSets, esc, toast
} from "./js/core.js";
import { db } from "./js/firebase.js";
import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const ctx = await requireAuth();
if (ctx) {
  const { user, profile, isAdmin } = ctx;
  renderLayout(profile, "home", isAdmin);
  let sets = null;
  try {
    const { rows } = await loadQuestions();
    sets = buildSets(rows);
  } catch {}
  renderBookmarks(profile, sets, user);
}

function renderBookmarks(p, sets, user) {
  const bms = p.bookmarks || [];
  if (!bms.length) {
    document.getElementById("app").innerHTML = `
      <div class="wrap" style="padding:16px 0 40px">
        <button class="btn btn-ghost btn-sm mb-2" onclick="location.href='./home.html'">← Back</button>
        <h2 class="mb-2">My Bookmarks</h2>
        <div class="empty"><div class="big">🔖</div>No bookmarks yet.<br>Tap the bookmark icon on any question during practice.</div>
      </div>`;
    return;
  }
  document.getElementById("app").innerHTML = `
    <div class="wrap" style="padding:16px 0 40px">
      <button class="btn btn-ghost btn-sm mb-2" onclick="location.href='./home.html'">← Back</button>
      <h2 class="mb-2">My Bookmarks (${bms.length})</h2>
      ${bms.map((bm, i) => {
        const set = sets?.[bm.set - 1]; if (!set) return "";
        const sec = set.sections.find(s => s.key === bm.section); if (!sec) return "";
        const q = sec.questions[bm.qi]; if (!q) return "";
        return `<div class="card mb-1">
          <div class="flex-between mb-1">
            <span class="badge badge-info">Set ${bm.set} · ${sec.short}</span>
            <button class="btn btn-sm btn-ghost" data-rm="${i}">Remove</button>
          </div>
          <div style="font-size:13.5px;line-height:1.5;margin-bottom:8px">${esc(q.q)}</div>
          ${q.o.map((t, oi) => t ? `<div style="padding:7px 10px;font-size:12px;color:var(--muted);border-radius:6px;margin-top:4px;${oi === q.a ? "background:#d1fae5;color:#047857;font-weight:700" : ""}">
            ${"ABCD"[oi]}. ${esc(t)} ${oi === q.a ? "✓" : ""}</div>` : "").join("")}
        </div>`;
      }).join("")}
    </div>`;
  document.querySelectorAll("[data-rm]").forEach(b => {
    b.onclick = async () => {
      const newBms = [...bms];
      newBms.splice(+b.dataset.rm, 1);
      try {
        await updateDoc(doc(db, "users", user.uid), { bookmarks: newBms });
        toast("Removed", "ok");
        location.reload();
      } catch (e) { toast("Failed: " + e.message, "err"); }
    };
  });
}
</script>
</body>
</html>
