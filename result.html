<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dream Japan — Result</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import {
  requireAuth, renderLayout, loadResult, loadQuestions, buildSets, totalsFor, esc
} from "./js/core.js";

const ctx = await requireAuth();
if (ctx) {
  const { profile, isAdmin } = ctx;
  renderLayout(profile, "sets", isAdmin);
  const result = loadResult();
  if (!result) {
    document.getElementById("app").innerHTML = `<div class="wrap" style="padding:24px">
      <div class="card center"><div class="empty"><div class="big">📭</div>
      No result to display.<br><button class="btn btn-primary mt-2" onclick="location.href='./sets.html'">Back to Sets</button>
      </div></div></div>`;
  } else {
    try {
      const { rows } = await loadQuestions();
      const totals = totalsFor(buildSets(rows));
      renderResult(result, totals);
    } catch {}
  }
}

function renderResult(r, totals) {
  const pass = r.score >= (totals?.passMarks || Math.round(r.maxScore * 0.8));
  const pct = r.percentage;
  document.getElementById("app").innerHTML = `
    <div class="wrap" style="padding:16px 0 40px">
      <div class="result-card">
        <div class="result-badge ${pass ? "pass" : "fail"}">${pass ? "PASSED" : "NOT PASSED"}</div>
        <span class="muted" style="font-size:11px;letter-spacing:1.2px;font-weight:800">
          SET ${r.setIdx} · ${esc(r.setName)}</span>
        <div class="ring mt-2">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <circle class="bg" cx="80" cy="80" r="68"/>
            <circle class="fg" id="resultRing" cx="80" cy="80" r="68"
              stroke-dasharray="427.3" stroke-dashoffset="427.3"
              stroke="${pass ? "var(--green)" : "var(--red)"}"/>
          </svg>
          <div><b>${r.score}</b><span>/ ${r.maxScore}</span></div>
        </div>
        <div class="grade-text">${pass
          ? (pct >= 95 ? "🌸 Outstanding!" : "✅ Passed — well done!")
          : `❌ Need ${(totals?.passMarks || Math.round(r.maxScore * 0.8)) - r.score} more marks to pass`}</div>
        <div class="result-stats">
          <div><h4>Correct</h4><p class="g">${r.correct}</p></div>
          <div><h4>Wrong</h4><p class="r">${r.wrong}</p></div>
          <div><h4>Skipped</h4><p>${r.unanswered}</p></div>
          <div><h4>Percent</h4><p>${pct}%</p></div>
        </div>
      </div>

      <div class="card mt-2">
        <h3 class="mb-2">Section Breakdown</h3>
        ${r.sections.map(s => `
          <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border)">
            <div style="font-size:12px;font-weight:800">${esc(s.name)}</div>
            <div style="font-size:12px;font-weight:900;color:var(--purple)">${s.score} / ${s.max}</div>
          </div>`).join("")}
      </div>

      <div class="grid-2 mt-2">
        <button class="btn btn-ghost" onclick="location.href='./review.html?filter=all'">All Answers</button>
        <button class="btn btn-ghost" onclick="location.href='./review.html?filter=wrong'">Wrong Only</button>
      </div>
      <button class="btn btn-teal btn-block mt-1" id="shareBtn">📤 Share Result</button>
      <button class="btn btn-primary btn-block mt-1" id="retryBtn">Try Again</button>
      <button class="btn btn-ghost btn-block mt-1" onclick="location.href='./sets.html'">Back to Sets</button>
    </div>`;

  setTimeout(() => {
    const ring = document.getElementById("resultRing");
    if (ring) ring.style.strokeDashoffset = 427.3 * (1 - pct / 100);
  }, 100);

  document.getElementById("retryBtn").onclick = () => {
    location.href = `./start.html?set=${r.setIdx - 1}`;
  };
  document.getElementById("shareBtn").onclick = async () => {
    const text = `🎌 I scored ${r.score}/${r.maxScore} (${r.percentage}%) on Dream Japan JFT Mock Test!\nSet ${r.setIdx} · ${r.setName}\n${pass ? "✅ PASSED" : "📚 Practicing hard"}\n#JFT #DreamJapan`;
    if (navigator.share) {
      try { await navigator.share({ title: "Dream Japan JFT Result", text }); return; } catch {}
    }
    try {
      await navigator.clipboard.writeText(text);
      import("./js/core.js").then(m => m.toast("Copied to clipboard ✓", "ok"));
    } catch {}
  };
}
</script>
</body>
</html>
